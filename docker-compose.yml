services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "${BACKEND_PORT:-5003}:5003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/appsettings.Production.json:/app/appsettings.Production.json
